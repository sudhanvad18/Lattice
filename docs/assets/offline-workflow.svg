<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="464" viewBox="0 0 1200 464" role="img" aria-labelledby="title description">
  <title id="title">Lattice scripted offline workflow</title>
  <desc id="description">Actual orchestrator output with scripted model responses. The workflow plans, researches, writes, rejects a draft, revises, and approves. The completed run produces three artifacts, two reviews, and six mock-provider calls. It makes no model or network requests.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#7e8bac" stroke-width="1.4"/></marker>
  </defs>
  <rect width="1200" height="464" rx="20" fill="#121827"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="36" y="42" font-size="12" font-weight="700" letter-spacing="2" fill="#a8b7de">LATTICE / SCRIPTED OFFLINE DEMONSTRATION</text>
    <text x="36" y="82" font-size="30" font-weight="600" fill="#f2f5ff">A complete revision loop, locally.</text>
    <text x="36" y="108" font-size="14" fill="#aab6cf">Actual orchestrator output · fixture responses · no model or network requests</text>
    <g fill="none" stroke="#7e8bac" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M190 171H226"/><path d="M384 171H420"/><path d="M578 171H614"/>
      <path d="M772 171H808"/><path d="M966 171H1002"/>
    </g>
    <g>
      <rect x="36" y="137" width="154" height="68" rx="10" fill="#252f47" stroke="#374563"/>
      <rect x="230" y="137" width="154" height="68" rx="10" fill="#252f47" stroke="#374563"/>
      <rect x="424" y="137" width="154" height="68" rx="10" fill="#252f47" stroke="#374563"/>
      <rect x="618" y="137" width="154" height="68" rx="10" fill="#3a2e44" stroke="#72506f"/>
      <rect x="812" y="137" width="154" height="68" rx="10" fill="#302f54" stroke="#625ca7"/>
      <rect x="1006" y="137" width="158" height="68" rx="10" fill="#203f40" stroke="#437e78"/>
    </g>
    <g font-size="17" font-weight="600" text-anchor="middle" fill="#f2f5ff">
      <text x="113" y="177">Plan</text><text x="307" y="177">Research</text><text x="501" y="177">Write</text>
      <text x="695" y="177" fill="#f0bedc">Reject</text><text x="889" y="177" fill="#cdc7ff">Revise</text><text x="1085" y="177" fill="#b0eadb">Approve</text>
    </g>
    <rect x="36" y="231" width="1128" height="188" rx="12" fill="#0b101c" stroke="#2a344a"/>
    <text x="58" y="258" font-size="11" font-weight="700" letter-spacing="1.3" fill="#8698bf">CAPTURED RUN / examples/mock_workflow.py</text>
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#cbd5ea">
      <text x="58" y="290">Status: <tspan fill="#9fddc8">completed</tspan></text>
      <text x="58" y="318">Artifacts: 3 (1 research, 2 document versions)</text>
      <text x="58" y="346">Reviews: rejected -&gt; approved</text>
      <text x="58" y="374">Provider calls: 6</text>
      <text x="682" y="290">Provider: MockProvider</text>
      <text x="682" y="318" fill="#a3afc8">(scripted responses)</text>
      <text x="682" y="374">Network/model requests: none</text>
    </g>
    <text x="36" y="444" font-size="12" fill="#91a1c1">Demonstrates control flow and artifact handling. These fixture results do not measure model quality.</text>
  </g>
</svg>
