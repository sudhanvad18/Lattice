[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lattice"
version = "0.1.0"
description = "Autonomous multi-agent orchestration platform with knowledge-graph-augmented RAG"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    # Agent orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",

    # Knowledge graph
    "networkx>=3.0",
    "neo4j>=5.0.0",

    # Vector store + embeddings
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",

    # LLM providers
    "anthropic>=0.39.0",
    "openai>=1.50.0",

    # Document processing
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "tiktoken>=0.7.0",

    # NLP / entity extraction
    "spacy>=3.7.0",

    # API framework
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=13.0",

    # Data layer
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",

    # Observability
    "structlog>=24.0.0",
    "langfuse>=2.0.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "PyGithub>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.100.0",
    "mypy>=1.10.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
]
local = [
    "ollama>=0.3.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packages/core", "packages/api", "packages/mcp"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["lattice", "lattice_api", "lattice_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=packages --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.hatch.build.targets.wheel]
packages = ["packages/core/lattice", "packages/api/lattice_api", "packages/mcp/lattice_mcp"]
